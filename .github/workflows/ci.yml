name: MedSync CI

on:
  push:
    branches: [ main, master, develop, Thanu ]
  pull_request:
    branches: [ main, master, develop, Thanu ]

jobs:
  backend-lint:
    name: Backend Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, gd, fileinfo, mbstring, dom, xml

      - name: Validate composer.json
        run: cd api && composer validate --strict

      - name: Install Composer Dependencies
        run: cd api && composer install --prefer-dist --no-progress

      - name: PHP Syntax Check (Lint)
        run: |
          find api -name "*.php" -not -path "api/vendor/*" -exec php -l {} +

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Frontend Application
        run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost/medsync/api
